name: Build Retrv Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Retrv Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci

      # ----------------------------------------------------------
      # 4. Build Ionic/Vue application with Supabase & Retrv API
      # ----------------------------------------------------------
      - name: Build Ionic application
        env:
          VITE_API_SERVER_URL: ${{ secrets.VITE_API_SERVER_URL || 'https://retrv-app.vercel.app' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wertxmepxlozdkfriewu.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_X35InNxn0EnGtr_8HiIe5A_emvUHgsA' }}
        run: npm run build

      # ----------------------------------------------------------
      # 5. Install Java 21
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ----------------------------------------------------------
      # 6. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ----------------------------------------------------------
      # 7. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ----------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ----------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # ----------------------------------------------------------
      # 10. Build APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ----------------------------------------------------------
      # 11. Prepare APK Artifact
      # ----------------------------------------------------------
      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Retrv-app.apk

      # ----------------------------------------------------------
      # 12. Upload APK to GitHub Actions Artifacts
      # ----------------------------------------------------------
      - name: Upload Retrv APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Retrv-APK
          path: Retrv-app.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # 13. Publish GitHub Release (When a tag is pushed)
      # ----------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Retrv-app.apk
          name: Retrv ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true