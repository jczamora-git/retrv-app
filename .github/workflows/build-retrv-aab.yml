name: Build Retrv Google Play AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Retrv Release AAB
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout Project
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Setup Node.js (LTS 20)
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ----------------------------------------------------------
      # 3. Install NPM Dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci

      # ----------------------------------------------------------
      # 4. Build Web Application Bundle
      # ----------------------------------------------------------
      - name: Build Web Application
        env:
          VITE_API_SERVER_URL: ${{ secrets.VITE_API_SERVER_URL || 'https://retrv-app.vercel.app' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wertxmepxlozdkfriewu.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_X35InNxn0EnGtr_8HiIe5A_emvUHgsA' }}
        run: npm run build

      # ----------------------------------------------------------
      # 5. Set up Java 21
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ----------------------------------------------------------
      # 6. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ----------------------------------------------------------
      # 7. Make Gradle Executable
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ----------------------------------------------------------
      # 8. Decode Keystore (Optional if GitHub Secrets are provided)
      # ----------------------------------------------------------
      - name: Decode Release Keystore
        if: ${{ secrets.RETRV_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.RETRV_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore

      # ----------------------------------------------------------
      # 9. Build Android App Bundle (Release)
      # ----------------------------------------------------------
      - name: Build Android App Bundle (.aab)
        working-directory: android
        env:
          RETRV_KEYSTORE_FILE: ${{ secrets.RETRV_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RETRV_KEYSTORE_PASSWORD: ${{ secrets.RETRV_KEYSTORE_PASSWORD }}
          RETRV_KEY_ALIAS: ${{ secrets.RETRV_KEY_ALIAS }}
          RETRV_KEY_PASSWORD: ${{ secrets.RETRV_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ----------------------------------------------------------
      # 10. Copy and Upload AAB Artifact
      # ----------------------------------------------------------
      - name: Prepare AAB Artifact
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Retrv-v1.aab

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Retrv-v1-PlayStore-AAB
          path: Retrv-v1.aab
          if-no-files-found: error
          retention-days: 30
